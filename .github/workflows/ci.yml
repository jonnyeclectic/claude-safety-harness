name: CI

# Gate every PR (and pushes to main) on the hook behavioral suite, so a change
# to the guards can't silently start blocking legitimate work or stop catching
# the catastrophic ops.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # setup-python publishes Python 3.9 for Ubuntu 24.04, but not 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The hooks target stdlib only; prove the range boost's loops run on.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Go through make so CI and the local gate can't drift apart -- the lint
      # target also covers the extensionless bin/ scripts, which a bare
      # `compileall hooks tests` silently skips.
      - name: Byte-compile hooks and bin/ scripts (syntax gate)
        run: make lint PYTHON=python

      - name: Run hook behavioral suite
        run: make test PYTHON=python
