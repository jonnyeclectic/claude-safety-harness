name: CI

# Gate every PR (and pushes to main) on the hook behavioral suite, so a change
# to the guards can't silently start blocking legitimate work or stop catching
# the catastrophic ops.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hooks target stdlib only; prove the range boost's loops run on.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile hooks (syntax gate)
        run: python -m compileall -q hooks tests

      - name: Run hook behavioral suite
        run: python -m unittest discover -s tests -v
